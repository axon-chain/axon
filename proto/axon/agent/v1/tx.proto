syntax = "proto3";
package axon.agent.v1;

option go_package = "github.com/axon-chain/axon/x/agent/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc Register(MsgRegister) returns (MsgRegisterResponse);
  rpc AddStake(MsgAddStake) returns (MsgAddStakeResponse);
  rpc UpdateAgent(MsgUpdateAgent) returns (MsgUpdateAgentResponse);
  rpc Heartbeat(MsgHeartbeat) returns (MsgHeartbeatResponse);
  rpc Deregister(MsgDeregister) returns (MsgDeregisterResponse);
  rpc ReduceStake(MsgReduceStake) returns (MsgReduceStakeResponse);
  rpc ClaimReducedStake(MsgClaimReducedStake) returns (MsgClaimReducedStakeResponse);
  rpc SubmitAIChallengeResponse(MsgSubmitAIChallengeResponse) returns (MsgSubmitAIChallengeResponseResponse);
  rpc RevealAIChallengeResponse(MsgRevealAIChallengeResponse) returns (MsgRevealAIChallengeResponseResponse);
  rpc RegisterService(MsgRegisterService) returns (MsgRegisterServiceResponse);
  rpc UpdateService(MsgUpdateService) returns (MsgUpdateServiceResponse);
  rpc DisableService(MsgDisableService) returns (MsgDisableServiceResponse);
  rpc CallService(MsgCallService) returns (MsgCallServiceResponse);
  rpc CreateTask(MsgCreateTask) returns (MsgCreateTaskResponse);
  rpc CancelTask(MsgCancelTask) returns (MsgCancelTaskResponse);
  rpc SubmitBid(MsgSubmitBid) returns (MsgSubmitBidResponse);
  rpc SelectBid(MsgSelectBid) returns (MsgSelectBidResponse);
  rpc CompleteTask(MsgCompleteTask) returns (MsgCompleteTaskResponse);
  rpc RegisterTool(MsgRegisterTool) returns (MsgRegisterToolResponse);
  rpc CallTool(MsgCallTool) returns (MsgCallToolResponse);
  rpc SubmitL2Report(MsgSubmitL2Report) returns (MsgSubmitL2ReportResponse);
}

message MsgRegister {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string capabilities = 2;
  string model = 3;
  cosmos.base.v1beta1.Coin stake = 4 [(gogoproto.nullable) = false];
}

message MsgRegisterResponse {
  string agent_id = 1;
}

message MsgAddStake {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  cosmos.base.v1beta1.Coin stake = 2 [(gogoproto.nullable) = false];
}

message MsgAddStakeResponse {
  cosmos.base.v1beta1.Coin total_stake = 1 [(gogoproto.nullable) = false];
}

message MsgUpdateAgent {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string capabilities = 2;
  string model = 3;
}

message MsgUpdateAgentResponse {}

message MsgHeartbeat {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
}

message MsgHeartbeatResponse {}

message MsgDeregister {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
}

message MsgDeregisterResponse {}

message MsgReduceStake {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgReduceStakeResponse {}

message MsgClaimReducedStake {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
}

message MsgClaimReducedStakeResponse {}

message MsgSubmitAIChallengeResponse {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  uint64 epoch = 2;
  string commit_hash = 3;
}

message MsgSubmitAIChallengeResponseResponse {}

message MsgRevealAIChallengeResponse {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  uint64 epoch = 2;
  string reveal_data = 3;
}
message MsgRevealAIChallengeResponseResponse {}

message MsgRegisterService {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string name = 2;
  string description = 3;
  repeated string capabilities = 4;
  repeated string input_types = 5;
  repeated string output_types = 6;
  cosmos.base.v1beta1.Coin price_per_call = 7 [(gogoproto.nullable) = false];
  string endpoint = 8;
}
message MsgRegisterServiceResponse {
  string service_id = 1;
}

message MsgUpdateService {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string service_id = 2;
  string name = 3;
  string description = 4;
  cosmos.base.v1beta1.Coin price_per_call = 5 [(gogoproto.nullable) = false];
  string endpoint = 6;
}
message MsgUpdateServiceResponse {}

message MsgDisableService {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string service_id = 2;
}
message MsgDisableServiceResponse {}

message MsgCallService {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string service_id = 2;
  bytes input_data = 3;
  cosmos.base.v1beta1.Coin payment = 4 [(gogoproto.nullable) = false];
}
message MsgCallServiceResponse {
  bytes output_data = 1;
}

message MsgCreateTask {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string title = 2;
  string description = 3;
  repeated string required_capabilities = 4;
  cosmos.base.v1beta1.Coin budget = 5 [(gogoproto.nullable) = false];
  int64 deadline_blocks = 6;
}
message MsgCreateTaskResponse {
  string task_id = 1;
}

message MsgCancelTask {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string task_id = 2;
}
message MsgCancelTaskResponse {}

message MsgSubmitBid {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string task_id = 2;
  string proposal = 3;
  cosmos.base.v1beta1.Coin price = 4 [(gogoproto.nullable) = false];
}
message MsgSubmitBidResponse {}

message MsgSelectBid {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string task_id = 2;
  string agent_address = 3;
}
message MsgSelectBidResponse {}

message MsgCompleteTask {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string task_id = 2;
  string completion_data = 3;
}
message MsgCompleteTaskResponse {}

message MsgRegisterTool {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string name = 2;
  string description = 3;
  string input_schema = 4;
  string output_schema = 5;
  cosmos.base.v1beta1.Coin price = 6 [(gogoproto.nullable) = false];
  bool is_public = 7;
}
message MsgRegisterToolResponse {
  string tool_id = 1;
}

message MsgCallTool {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string tool_id = 2;
  bytes input_data = 3;
  cosmos.base.v1beta1.Coin payment = 4 [(gogoproto.nullable) = false];
}
message MsgCallToolResponse {
  bytes output_data = 1;
}

message MsgSubmitL2Report {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1;
  string target = 2;
  int32 score = 3;
  string evidence = 4;
  string reason = 5;
}
message MsgSubmitL2ReportResponse {}
