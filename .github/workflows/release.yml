name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Build release matrix
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
            OUT_DIR="${{ github.workspace }}/dist/releases" \
            RELEASE_NOTES_FILE="${{ github.workspace }}/CHANGELOG.md" \
            make package-all

      - name: Prepare direct-download binaries
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_PLAIN="${VERSION#v}"
          RELEASE_DIR="dist/releases/${VERSION}"

          cp "${RELEASE_DIR}/axond_${VERSION_PLAIN}_linux_amd64/axond" "${RELEASE_DIR}/axond_linux_amd64"
          cp "${RELEASE_DIR}/axond_${VERSION_PLAIN}_linux_arm64/axond" "${RELEASE_DIR}/axond_linux_arm64"

          sha256sum "${RELEASE_DIR}/axond_linux_amd64" | awk '{print $1}' > "${RELEASE_DIR}/axond_linux_amd64.sha256"
          sha256sum "${RELEASE_DIR}/axond_linux_arm64" | awk '{print $1}' > "${RELEASE_DIR}/axond_linux_arm64.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/releases/${{ steps.version.outputs.version }}/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/releases/${{ steps.version.outputs.version }}/*.tar.gz
            dist/releases/${{ steps.version.outputs.version }}/*.zip
            dist/releases/${{ steps.version.outputs.version }}/axond_linux_amd64
            dist/releases/${{ steps.version.outputs.version }}/axond_linux_amd64.sha256
            dist/releases/${{ steps.version.outputs.version }}/axond_linux_arm64
            dist/releases/${{ steps.version.outputs.version }}/axond_linux_arm64.sha256
            dist/releases/${{ steps.version.outputs.version }}/SHA256SUMS
            dist/releases/${{ steps.version.outputs.version }}/BUILD_REPORT.md
